name: MLS M1.7 real transport qualification

# Push: every automated gate (no signing). Manual dispatch additionally signs an
# Ad Hoc qualification IPA (WATCHLINK_QUALIFICATION diagnostics, relay URL from
# the WATCHLINK_RELAY_URL repository variable) and uploads it only age-encrypted.
on:
  push:
    branches:
      - integration/mls-m17-transport-20260927
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m17:
    runs-on: macos-26
    timeout-minutes: 180
    defaults:
      run:
        working-directory: integration/mls-m17
    env:
      BUNDLE_ID: com.batuhxn.watchlink
      EXPECTED_PROFILE_NAME: Watchlink Ad Hoc
      BUILD_NUMBER: ${{ github.run_number }}
      E2E_MARKER: M17-E2E-RELAY-MARKER-8b41
    steps:
      - name: Require signing inputs before a signed build
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RELAY_URL: ${{ vars.WATCHLINK_RELAY_URL }}
          AGE_RECIPIENT: ${{ vars.WATCHLINK_DEV_AGE_RECIPIENT }}
        working-directory: .
        run: |
          [[ "$RELAY_URL" =~ ^https://[A-Za-z0-9.-]+/?$ ]] || { echo "::error::WATCHLINK_RELAY_URL must be an https origin"; exit 1; }
          [[ "$AGE_RECIPIENT" =~ ^age1[qpzry9x8gf2tvdw0s3jn54khce6mua7l]{58}$ ]] || { echo "::error::age recipient missing"; exit 1; }
      - name: Checkout integration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - name: Pinned relationship to the qualified MLS core
        run: python3 WatchlinkMLS/check-qualified-core.py qualified/m15/swift/Sources qualified/m14-tests
      - name: Logging guards (Swift and relay)
        run: |
          python3 scripts/check-no-plaintext-logging.py --self-test
          python3 scripts/check-no-plaintext-logging.py Sources/Vault WatchlinkMLS/Sources WatchlinkMLS/Tests Tests
          if grep -rnE '\bconsole\.' relay/src; then echo '::error::relay must not log'; exit 1; fi
          grep -q '"observability": { "enabled": false' relay/wrangler.jsonc
      - name: Relay unit tests, typecheck and HTTP contract against local workerd
        working-directory: integration/mls-m17/relay
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          node --test test/mailbox.test.ts
          npx wrangler dev --local --port 8787 --ip 127.0.0.1 --persist-to "$RUNNER_TEMP/relay-state" \
            > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/wrangler.pid"
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8787/ && break; sleep 1; done
          RELAY_URL=http://127.0.0.1:8787 node --test test/http.e2e.ts
      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = 26.3
      - name: Install Rust and iOS targets
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add --toolchain 1.98.1 aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - name: Build the MLS bridge with the unchanged M1.5 recipe
        run: bash WatchlinkMLS/build-bridge.sh "$PWD/qualified/m15"
      - name: Generate the production project
        run: |
          for tool in xcodegen age; do brew list "$tool" >/dev/null 2>&1 || brew install "$tool"; done
          xcodegen generate --spec project.yml
      - name: Run production, transport, E2E and qualified-core XCTest
        env:
          TEST_RUNNER_WATCHLINK_RELAY_URL: http://127.0.0.1:8787
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          xcrun simctl list runtimes available -j > "$RUNNER_TEMP/runtimes.json"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          read -r runtime_id runtime_version udid device_type < <(
            python3 qualified/m15/pick-simulator.py "$sdk" "$RUNNER_TEMP/runtimes.json" "$RUNNER_TEMP/devices.json")
          if [ "$udid" = '-' ]; then udid="$(xcrun simctl create Watchlink-M17-CI "$device_type" "$runtime_id")"; fi
          echo "Using iOS Simulator $runtime_version"
          for suite in Vault-AppTests:73 WatchlinkMLS-QualifiedTests:24; do
            target="${suite%%:*}" expected="${suite##*:}"
            log="$RUNNER_TEMP/$target.log"
            set +e
            xcodebuild test -project Vault.xcodeproj -scheme Vault-App -only-testing:"$target" \
              -destination "platform=iOS Simulator,id=$udid" -derivedDataPath "$RUNNER_TEMP/M17TestDerivedData" \
              2>&1 | tee "$log"
            status="${PIPESTATUS[0]}"
            set -e
            python3 qualified/m15/check-xctest-log.py "$log"
            test "$status" -eq 0
            summary="$(grep -E 'Executed [0-9]+ tests?, with' "$log" | tail -n 1)"
            echo "$target: $summary"
            printf '%s' "$summary" | grep -Eq "Executed $expected tests?, with 0 failures" \
              || { echo "::error::$target expected exactly $expected tests, none skipped, 0 failures"; exit 1; }
            if grep -q '\[relay\]' "$log"; then echo "::error::a real RelayClient was active"; exit 1; fi
            if grep -q "$E2E_MARKER" "$log"; then echo "::error::plaintext marker in test output"; exit 1; fi
          done
      - name: Relay storage and logs never contain the E2E plaintext marker
        run: |
          set -euo pipefail
          kill "$(cat "$RUNNER_TEMP/wrangler.pid")" || true
          test -d "$RUNNER_TEMP/relay-state"
          files="$(find "$RUNNER_TEMP/relay-state" -type f | wc -l | tr -d ' ')"
          test "$files" -gt 0
          b64="$(printf '%s' "$E2E_MARKER" | base64)"
          for needle in "$E2E_MARKER" "$b64" "${b64%%=*}"; do
            if grep -rqaF "$needle" "$RUNNER_TEMP/relay-state" "$RUNNER_TEMP/wrangler.log"; then
              echo "::error::relay representation contains the plaintext marker"; exit 1
            fi
          done
          echo "Relay storage ($files files) and relay log: no plaintext marker: PASS"
      - name: Debug simulator build of Vault-App
        run: |
          xcodebuild build -project Vault.xcodeproj -scheme Vault-App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/M17DebugDerivedData" CODE_SIGNING_ALLOWED=NO
          grep -rqa 11RelayClientC "$RUNNER_TEMP/M17DebugDerivedData/Build/Products/Debug-iphonesimulator/Vault-App.app"
      - name: Production Release device build and binary gates
        run: |
          set -euo pipefail
          xcodebuild build -project Vault.xcodeproj -scheme Vault-App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/M17ReleaseDerivedData" CODE_SIGNING_ALLOWED=NO
          app="$RUNNER_TEMP/M17ReleaseDerivedData/Build/Products/Release-iphoneos/Vault-App.app"
          binary="$app/Vault-App"
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$app/Info.plist" 2>/dev/null || true; }
          test "$(pb CFBundleIdentifier)" = com.batuhxn.watchlink
          test -z "$(pb WatchlinkRelayURL)" || { echo '::error::relay URL baked into the default build'; exit 1; }
          test -n "$(pb NSCameraUsageDescription)"
          ! /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity' "$app/Info.plist" >/dev/null 2>&1 \
            || { echo '::error::ATS exception in Vault-App'; exit 1; }
          test ! -e "$app/PlugIns"
          xcrun otool -L "$binary" | tee "$RUNNER_TEMP/m17-linked.txt"
          if grep -E 'lib(crypto|ssl)\.' "$RUNNER_TEMP/m17-linked.txt"; then echo '::error::OpenSSL dylib'; exit 1; fi
          xcrun nm -gU "$binary" > "$RUNNER_TEMP/m17-symbols.txt"
          grep -q _uniffi_mls_rs_uniffi_ "$RUNNER_TEMP/m17-symbols.txt"
          grep -q init_callback_vtable_keypackagestorage "$RUNNER_TEMP/m17-symbols.txt"
          strings -a "$binary" > "$RUNNER_TEMP/m17-strings.txt"
          for required in MLSCryptoEngine TransportWorker HTTPRelayAPI; do
            grep -q "$required" "$RUNNER_TEMP/m17-strings.txt" || { echo "::error::$required missing"; exit 1; }
          done
          for legacy in 11RelayClientC 9ChatStoreC 18RelayConfigurationV 17RelayFrameDecoderV 13MessageBubbleV \
                        11ChatMessageV '\[relay\]' '192\.168\.' DiagnosticsView m17.delivery.paused; do
            if grep -q "$legacy" "$RUNNER_TEMP/m17-strings.txt" "$RUNNER_TEMP/m17-symbols.txt"; then
              echo "::error::'$legacy' present in production Release"; exit 1
            fi
          done
          echo 'Production Release: static MLS + P1, no OpenSSL dylib, no legacy plaintext route, no diagnostics, no ATS exception: PASS'
      - name: Qualification Release compile (diagnostics present only here)
        run: |
          set -euo pipefail
          xcodebuild build -project Vault.xcodeproj -scheme Vault-App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/M17QualDerivedData" CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=WATCHLINK_QUALIFICATION WATCHLINK_RELAY_URL=https://relay.invalid
          app="$RUNNER_TEMP/M17QualDerivedData/Build/Products/Release-iphoneos/Vault-App.app"
          strings -a "$app/Vault-App" > "$RUNNER_TEMP/m17-qual-strings.txt"
          grep -q DiagnosticsView "$RUNNER_TEMP/m17-qual-strings.txt"
          test "$(/usr/libexec/PlistBuddy -c 'Print :WatchlinkRelayURL' "$app/Info.plist")" = https://relay.invalid
          if grep -qE '11RelayClientC|9ChatStoreC' "$RUNNER_TEMP/m17-qual-strings.txt"; then exit 1; fi
          echo 'Qualification Release: diagnostics compiled in, legacy demo absent: PASS'

      # ---- Signed Ad Hoc qualification IPA (manual dispatch only) ----
      - name: Import signing certificate into an ephemeral keychain
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          IOS_DIST_P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/watchlink-signing.keychain-db"
          p12="$RUNNER_TEMP/watchlink-dist.p12"
          printf '%s' "$IOS_DIST_P12_B64" | base64 --decode > "$p12"
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -f pkcs12 -t cert \
            -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user | xargs security list-keychains -d user -s "$keychain"
          identities="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/^.*"\(Apple Distribution: .*\)"$/\1/p')"
          [ "$(printf '%s' "$identities" | grep -c . || true)" = 1 ] || { echo "::error::expected one identity"; exit 1; }
          holder="$(printf '%s' "$identities" | sed -E 's/^Apple Distribution: (.*) \([A-Z0-9]+\)$/\1/')"
          echo "::add-mask::$identities"
          echo "::add-mask::$holder"
          case "$identities" in *"($APPLE_TEAM_ID)") ;; *) echo "::error::identity/team mismatch"; exit 1 ;; esac
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
      - name: Install and verify Ad Hoc provisioning profile
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          IOS_ADHOC_PROFILE_B64: ${{ secrets.IOS_ADHOC_PROFILE_B64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          profile="$RUNNER_TEMP/watchlink-adhoc.mobileprovision"
          decoded="$RUNNER_TEMP/watchlink-adhoc.plist"
          printf '%s' "$IOS_ADHOC_PROFILE_B64" | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$decoded" 2>/dev/null
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$decoded" 2>/dev/null; }
          fail() { echo "::error::Ad Hoc profile: $1"; exit 1; }
          team_name="$(pb TeamName || true)"
          if [ -n "$team_name" ]; then echo "::add-mask::$team_name"; fi
          devices="$(plutil -extract ProvisionedDevices raw -o - "$decoded" 2>/dev/null || echo 0)"
          [[ "$devices" =~ ^[0-9]+$ ]] && [ "$devices" -ge 2 ] || fail "needs the iPhone AND the iPad registered (found $devices)"
          for ((i = 0; i < devices; i++)); do echo "::add-mask::$(plutil -extract "ProvisionedDevices.$i" raw -o - "$decoded")"; done
          uuid="$(pb UUID || true)"; name="$(pb Name || true)"
          [ "$name" = "$EXPECTED_PROFILE_NAME" ] || fail "unexpected profile name"
          [ "$(pb Entitlements:application-identifier || true)" = "$APPLE_TEAM_ID.$BUNDLE_ID" ] || fail "App ID mismatch"
          [ "$(pb Entitlements:get-task-allow || true)" = false ] || fail "get-task-allow is not false"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"; cp "$profile" "$dir/$uuid.mobileprovision"
          done
          rm -f "$profile" "$decoded"
          { echo "PROFILE_UUID=$uuid"; echo "PROFILE_NAME=$name"; } >> "$GITHUB_ENV"
          echo "Ad Hoc profile ($devices devices): PASS"
      - name: Archive, export, verify and encrypt the qualification IPA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELAY_URL: ${{ vars.WATCHLINK_RELAY_URL }}
          AGE_RECIPIENT: ${{ vars.WATCHLINK_DEV_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$RELAY_URL"
          xcodebuild archive -project Vault.xcodeproj -scheme Vault-App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/watchlink-m17.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/watchlink-m17-derived" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION=0.1.7 CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=WATCHLINK_QUALIFICATION WATCHLINK_RELAY_URL="${RELAY_URL%/}" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" > "$RUNNER_TEMP/watchlink-m17-archive.log" 2>&1 \
            || { tail -n 40 "$RUNNER_TEMP/watchlink-m17-archive.log"; exit 1; }
          options="$RUNNER_TEMP/watchlink-ExportOptions.plist"
          cat > "$options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>release-testing</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/watchlink-m17.xcarchive" \
            -exportPath "$RUNNER_TEMP/watchlink-m17-export" -exportOptionsPlist "$options" > /dev/null
          ipa="$(find "$RUNNER_TEMP/watchlink-m17-export" -maxdepth 1 -name '*.ipa')"
          [ "$(printf '%s\n' "$ipa" | grep -c .)" = 1 ]
          unzip -q "$ipa" -d "$RUNNER_TEMP/watchlink-m17-ipa"
          app="$RUNNER_TEMP/watchlink-m17-ipa/Payload/Vault-App.app"
          codesign --verify --deep --strict "$app"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = "$BUNDLE_ID" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :WatchlinkRelayURL' "$app/Info.plist")" = "${RELAY_URL%/}" ]
          strings -a "$app/Vault-App" > "$RUNNER_TEMP/watchlink-m17-strings.txt"
          grep -q DiagnosticsView "$RUNNER_TEMP/watchlink-m17-strings.txt"
          mkdir -p "$RUNNER_TEMP/watchlink-m17-out"
          out="$RUNNER_TEMP/watchlink-m17-out/Watchlink-M17-$BUILD_NUMBER.ipa.age"
          age -r "$AGE_RECIPIENT" -o "$out" "$ipa"
          [ "$(head -c 21 "$out")" = "age-encryption.org/v1" ]
          rm -rf "$RUNNER_TEMP/watchlink-m17-export" "$RUNNER_TEMP/watchlink-m17-ipa" "$RUNNER_TEMP/watchlink-m17.xcarchive" \
                 "$RUNNER_TEMP/watchlink-m17-derived"
          echo "ENCRYPTED_IPA=$out" >> "$GITHUB_ENV"
          echo "Signed qualification IPA build $BUILD_NUMBER encrypted: PASS"
      - name: Upload encrypted qualification IPA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watchlink-m17-${{ github.run_number }}
          path: ${{ env.ENCRYPTED_IPA }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Clean up signing material
        if: ${{ always() }}
        working-directory: .
        run: |
          security delete-keychain "$RUNNER_TEMP/watchlink-signing.keychain-db" 2>/dev/null || true
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
                  "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          rm -rf "$RUNNER_TEMP"/watchlink-*
