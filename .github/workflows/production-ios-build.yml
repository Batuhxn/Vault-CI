name: Production Watchlink iOS build

# MVP (Firebase) unsigned build proof only. No signing, no Apple credentials,
# no upload. Manual only: the public mirror must not spend macOS runner time on
# arbitrary pull requests. The MLS unit/qualification suites live on branch
# park/mls-e2ee of the private repository and are not part of this build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-device-builds:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false

      - name: Check production source for plaintext message logging
        run: |
          set -euo pipefail
          python3 scripts/check-no-plaintext-logging.py --self-test
          python3 scripts/check-no-plaintext-logging.py Sources/Vault

      - name: Select Xcode 26.3
        run: |
          set -euo pipefail
          xcode_path=/Applications/Xcode_26.3.app
          if [ ! -d "$xcode_path" ]; then
            echo "::error::$xcode_path not found on this runner image. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode_path"
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = 26.3

      # Optional here: the unsigned build compiles without it. TestFlight requires it.
      - name: Write Firebase config from secret (if set)
        env:
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICE_INFO_PLIST_B64:-}" ]; then
            umask 077
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > Sources/Vault/GoogleService-Info.plist
            plutil -lint Sources/Vault/GoogleService-Info.plist >/dev/null
            echo "Firebase config: present"
          else
            echo "Firebase config: not set (build only)"
          fi

      - name: Install XcodeGen and generate the production project
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version
          xcodegen generate --spec project.yml

      - name: Unsigned device builds (Debug + Release)
        run: |
          set -euo pipefail
          for config in Debug Release; do
            xcodebuild -project Vault.xcodeproj -scheme Vault-App -configuration "$config" \
              -sdk iphoneos -destination 'generic/platform=iOS' \
              -derivedDataPath "$RUNNER_TEMP/WatchlinkDerivedData-$config" \
              CODE_SIGNING_ALLOWED=NO build
            echo "Unsigned $config build: PASS"
          done
