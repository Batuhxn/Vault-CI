name: Production Watchlink iOS build

# Unit tests + unsigned build proof only. No signing, no Apple credentials, no
# upload. Manual only: the public mirror must not spend macOS runner time on
# arbitrary pull requests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-device-builds:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false

      - name: Check production source for plaintext message logging
        run: |
          set -euo pipefail
          python3 scripts/check-no-plaintext-logging.py --self-test
          python3 scripts/check-no-plaintext-logging.py Sources/Vault

      - name: Select Xcode 26.3
        run: |
          set -euo pipefail
          xcode_path=/Applications/Xcode_26.3.app
          if [ ! -d "$xcode_path" ]; then
            echo "::error::$xcode_path not found on this runner image. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode_path"
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = 26.3

      - name: Install XcodeGen and generate the production project
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version
          xcodegen generate --spec project.yml

      # Toolchain split (deliberate, temporary; see docs/CI_OPEN_ISSUES.md CI-2):
      # Xcode 26.3 is the canonical production build toolchain. GitHub's
      # macos-26 image does not install a concrete simulator runtime for it, so
      # the XCTest target is first COMPILED under 26.3 (build-for-testing, no
      # simulator needed), then EXECUTED with the preinstalled Xcode 26.2 and
      # its iOS 26.2 runtime. Every production build step runs under 26.3.
      # This must not silently become the permanent architecture.
      - name: Compile unit tests with Xcode 26.3 (build-for-testing, no simulator)
        run: |
          set -euo pipefail
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = 26.3
          xcodebuild build-for-testing \
            -project Vault.xcodeproj \
            -scheme Vault-App \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/WatchlinkTestCompileDerivedData" \
            CODE_SIGNING_ALLOWED=NO
          echo "Xcode 26.3 build-for-testing: PASS"

      - name: Select Xcode 26.2 and an iOS Simulator for test execution
        run: |
          set -euo pipefail
          xcode_path=/Applications/Xcode_26.2.app
          if [ ! -d "$xcode_path" ]; then
            echo "::error::$xcode_path not found on this runner image. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode_path"
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = 26.2
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "Xcode 26.2 iphonesimulator SDK: $sdk"

          echo "::group::xcrun simctl list runtimes"
          xcrun simctl list runtimes
          echo "::endgroup::"
          echo "::group::xcrun simctl list devices available"
          xcrun simctl list devices available
          echo "::endgroup::"

          xcrun simctl list runtimes available -j > "$RUNNER_TEMP/sim-runtimes.json"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/sim-devices.json"
          cat > "$RUNNER_TEMP/pick-simulator.py" <<'PY'
          import json, sys

          def version(text):
              return tuple(int(part) for part in text.split(".")[:2])

          sdk = version(sys.argv[1])
          runtimes = [
              r for r in json.load(open(sys.argv[2]))["runtimes"]
              if r.get("isAvailable") and "SimRuntime.iOS-" in r.get("identifier", "")
              and (17, 0) <= version(r["version"]) <= sdk
          ]
          if not runtimes:
              sys.exit(f"no available iOS 17+ simulator runtime compatible with SDK {sys.argv[1]}")
          # Prefer the runtime matching this Xcode's simulator SDK, then the newest.
          runtimes.sort(key=lambda r: (version(r["version"]) != sdk, [-p for p in version(r["version"])]))
          runtime = runtimes[0]

          devices = sorted(
              (d for d in json.load(open(sys.argv[3]))["devices"].get(runtime["identifier"], [])
               if d.get("isAvailable") and d["name"].startswith("iPhone")),
              key=lambda d: d["name"],
          )
          device_types = sorted(
              (t for t in runtime.get("supportedDeviceTypes", []) if t.get("productFamily") == "iPhone"),
              key=lambda t: t["name"],
          )
          if not devices and not device_types:
              sys.exit(f"runtime {runtime['identifier']} has no iPhone device or device type")
          print(runtime["identifier"], runtime["version"],
                devices[0]["udid"] if devices else "-",
                device_types[0]["identifier"] if device_types else "-")
          PY
          read -r runtime_id runtime_version udid device_type < <(
            python3 "$RUNNER_TEMP/pick-simulator.py" "$sdk" \
              "$RUNNER_TEMP/sim-runtimes.json" "$RUNNER_TEMP/sim-devices.json")
          test -n "${runtime_id:-}" || { echo "::error::no usable iOS Simulator runtime"; exit 1; }

          if [ "$udid" = "-" ]; then
            udid="$(xcrun simctl create Watchlink-CI "$device_type" "$runtime_id")"
            echo "WATCHLINK_CI_CREATED_SIM=$udid" >> "$GITHUB_ENV"
            echo "Simulator: created Watchlink-CI ($device_type) on $runtime_id [$udid]"
          else
            echo "Simulator: pre-existing device [$udid] on $runtime_id"
          fi
          echo "WATCHLINK_TEST_SIM=$udid" >> "$GITHUB_ENV"
          echo "Test runtime: iOS $runtime_version"

      - name: Run production unit tests with Xcode 26.2
        run: |
          set -euo pipefail
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = 26.2
          log="$RUNNER_TEMP/watchlink-unit-tests.log"
          xcodebuild test \
            -project Vault.xcodeproj \
            -scheme Vault-App \
            -destination "platform=iOS Simulator,id=$WATCHLINK_TEST_SIM" \
            -derivedDataPath "$RUNNER_TEMP/WatchlinkTestRunDerivedData" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$log"

          # Last "Executed N tests, with M failures" line is the all-tests total.
          summary="$(grep -E 'Executed [0-9]+ tests?, with [0-9]+ failures?' "$log" | tail -n 1)"
          executed="$(printf '%s' "$summary" | sed -E 's/.*Executed ([0-9]+) tests?.*/\1/')"
          failures="$(printf '%s' "$summary" | sed -E 's/.*with ([0-9]+) failures?.*/\1/')"
          echo "XCTest summary: ${summary:-<none>}"
          [ -n "$executed" ] && [ "$executed" -ge 19 ] && [ "$failures" = 0 ] \
            || { echo "::error::expected >= 19 executed XCTest cases with 0 failures"; exit 1; }
          # RelayClient logs every connection attempt as "[relay] ...". Tests are
          # non-hosted and use a fake transport, so none may appear.
          if grep -q '\[relay\]' "$log"; then
            echo "::error::a real RelayClient was active during unit tests"
            exit 1
          fi
          echo "Unit tests: PASS ($executed executed, 0 failures, no relay activity)"

      - name: Delete the CI-created simulator
        if: ${{ always() && env.WATCHLINK_CI_CREATED_SIM != '' }}
        run: |
          set -uo pipefail
          xcrun simctl shutdown "$WATCHLINK_CI_CREATED_SIM" 2>/dev/null || true
          xcrun simctl delete "$WATCHLINK_CI_CREATED_SIM"

      - name: Re-select Xcode 26.3 for production builds
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = 26.3

      - name: Build Debug and Release for iPhone without signing
        run: |
          set -euo pipefail
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = 26.3
          for configuration in Debug Release; do
            xcodebuild \
              -project Vault.xcodeproj \
              -scheme Vault-App \
              -configuration "$configuration" \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$RUNNER_TEMP/VaultDerivedData" \
              CODE_SIGNING_ALLOWED=NO \
              build

            # Only the Vault-App target's block: the scheme also contains the
            # test target, whose settings must never satisfy these checks.
            settings="$(xcodebuild \
              -project Vault.xcodeproj \
              -scheme Vault-App \
              -configuration "$configuration" \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              -showBuildSettings \
              | sed -n '/^Build settings for action build and target Vault-App:$/,/^Build settings for /p')"
            if [ -z "$settings" ]; then
              echo "::error::$configuration build settings for target Vault-App not found"
              exit 1
            fi
            setting() {
              printf '%s\n' "$settings" | sed -n "s/^[[:space:]]*$1 = //p" | head -n 1
            }
            expect() {
              actual="$(setting "$1")"
              if [ "$actual" != "$2" ]; then
                echo "::error::$configuration $1 is '${actual:-<unset>}', expected '${2:-<unset>}'"
                exit 1
              fi
            }
            echo "Resolved $configuration production settings:"
            for key in PRODUCT_BUNDLE_IDENTIFIER PRODUCT_NAME MARKETING_VERSION \
              CURRENT_PROJECT_VERSION IPHONEOS_DEPLOYMENT_TARGET SWIFT_VERSION \
              CODE_SIGN_STYLE CODE_SIGNING_ALLOWED DEVELOPMENT_TEAM \
              CODE_SIGN_IDENTITY PROVISIONING_PROFILE_SPECIFIER; do
              value="$(setting "$key")"
              printf '%s=%s\n' "$key" "${value:-<unset>}"
            done
            expect PRODUCT_BUNDLE_IDENTIFIER com.batuhxn.watchlink
            expect PRODUCT_NAME Vault-App
            expect MARKETING_VERSION 0.1.0
            expect CURRENT_PROJECT_VERSION 1
            expect IPHONEOS_DEPLOYMENT_TARGET 17.0
            expect SWIFT_VERSION 5.0
            expect CODE_SIGN_STYLE Automatic
            expect CODE_SIGNING_ALLOWED NO
            expect DEVELOPMENT_TEAM ""
            expect PROVISIONING_PROFILE_SPECIFIER ""

            app="$RUNNER_TEMP/VaultDerivedData/Build/Products/${configuration}-iphoneos/Vault-App.app"
            plist="$app/Info.plist"
            test -d "$app" || { echo "::error::missing $configuration app bundle at $app"; exit 1; }
            test -f "$app/Vault-App" || { echo "::error::missing $configuration executable"; exit 1; }
            test -f "$plist" || { echo "::error::missing $configuration Info.plist"; exit 1; }
            test ! -e "$app/_CodeSignature" || { echo "::error::$configuration app is signed"; exit 1; }
            test ! -e "$app/PlugIns" || { echo "::error::$configuration app embeds PlugIns (test bundle leaked into build)"; exit 1; }
            plist_expect() {
              actual="$(/usr/libexec/PlistBuddy -c "Print :$1" "$plist")"
              if [ "$actual" != "$2" ]; then
                echo "::error::$configuration Info.plist $1 is '$actual', expected '$2'"
                exit 1
              fi
            }
            plist_expect CFBundleIdentifier com.batuhxn.watchlink
            plist_expect CFBundleDisplayName Watchlink
            plist_expect CFBundleExecutable Vault-App
            plist_expect CFBundleShortVersionString 0.1.0
            plist_expect CFBundleVersion 1
            plist_expect MinimumOSVersion 17.0
            lipo -archs "$app/Vault-App" | grep -qw arm64 || { echo "::error::$configuration binary is not arm64"; exit 1; }
            echo "$configuration unsigned iPhoneOS app and metadata: PASS"
          done
