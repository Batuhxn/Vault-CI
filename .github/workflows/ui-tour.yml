name: UI tour (simulator screenshots)

# Runs the app in demo mode (-WLDemo: in-memory pair, no network, no Firebase,
# no credentials) on iPhone simulators and photographs every screen. The
# screenshots are uploaded as an artifact for review. Manual only.
on:
  workflow_dispatch:
    inputs:
      devices:
        description: "Simulator names, comma-separated (first available ones are used if empty)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  tour:
    runs-on: macos-26
    timeout-minutes: 60
    # One phone per job: after a long UI test the simulator service on the
    # runner can drop its devices, so each size gets a fresh machine.
    strategy:
      fail-fast: false
      matrix:
        size: [small, large]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false

      # Screenshots only, nothing ships from here: use the newest Xcode on the
      # image, whose iOS simulator runtime is installed (TestFlight stays on 26.3).
      - name: Select the newest Xcode
        run: |
          set -euo pipefail
          xcode_path="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode_path"
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Install XcodeGen and generate the project
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Pick simulators (a small and a large iPhone)
        env:
          REQUESTED: ${{ inputs.devices }}
          SIZE: ${{ matrix.size }}
        run: |
          set -euo pipefail
          xcodebuild -showdestinations -project Vault.xcodeproj -scheme Vault-App > "$RUNNER_TEMP/dest.txt" 2>/dev/null || true
          python3 - "$RUNNER_TEMP/dest.txt" <<'PY' >> "$GITHUB_ENV"
          import os, re, sys
          sims = []
          for line in open(sys.argv[1]):
              if "platform:iOS Simulator" in line and "name:iPhone" in line and "placeholder" not in line:
                  fields = dict(re.findall(r"(\w+):([^,}]+)", line))
                  sims.append((fields["name"].strip(), fields.get("OS", "").strip(), fields["id"].strip()))
          sims.sort(key=lambda s: [int(x) for x in re.findall(r"\d+", s[1])], reverse=True)
          newest = sims[0][1] if sims else ""
          current = [s for s in sims if s[1] == newest]
          requested = [n.strip() for n in os.environ.get("REQUESTED", "").split(",") if n.strip()]
          def find(names):
              for n in names:
                  for s in current:
                      if s[0] == n: return s
              return None
          if requested:
              picked = [s for s in (find([n]) for n in requested) if s]
          else:
              small = find(["iPhone 16e", "iPhone SE (3rd generation)", "iPhone 17", "iPhone 16"]) or (current[0] if current else None)
              large = find(["iPhone 17 Pro Max", "iPhone 16 Pro Max", "iPhone Air"]) or (current[-1] if current else None)
              picked = [s for s in ((small,) if os.environ["SIZE"] == "small" else (large,)) if s]
          print("TOUR_DEVICES=" + "|".join(f"{s[2]}={s[0]} ({s[1]})" for s in dict.fromkeys(picked)))
          PY
          grep TOUR_DEVICES "$GITHUB_ENV"
          grep -q "TOUR_DEVICES=." "$GITHUB_ENV" || { echo "::error::no iPhone simulator"; cat "$RUNNER_TEMP/dest.txt"; exit 1; }

      - name: Build for testing
        run: |
          set -euo pipefail
          first="${TOUR_DEVICES%%|*}"
          xcodebuild build-for-testing -project Vault.xcodeproj -scheme Vault-App -configuration Debug \
            -destination "id=${first%%=*}" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= > "$RUNNER_TEMP/build.log" 2>&1 || {
              grep -E "error:|\*\* BUILD FAILED" "$RUNNER_TEMP/build.log" | sort -u | head -n 60
              tail -n 30 "$RUNNER_TEMP/build.log"
              exit 1
            }
            tail -n 5 "$RUNNER_TEMP/build.log"

      - name: Unit tests
        run: |
          set -uo pipefail
          first="${TOUR_DEVICES%%|*}"
          xcrun simctl boot "${first%%=*}" 2>/dev/null || true
          xcodebuild test-without-building -project Vault.xcodeproj -scheme Vault-App -configuration Debug \
            -destination "id=${first%%=*}" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -only-testing:WatchlinkTests > "$RUNNER_TEMP/unit.log" 2>&1
          status=$?
          grep -E "error: -|Test Case .* (passed|failed)|Executed [0-9]+ test" "$RUNNER_TEMP/unit.log" | tail -n 40
          [ $status -eq 0 ] || { tail -n 30 "$RUNNER_TEMP/unit.log"; echo "::error::unit tests failed"; exit 1; }

      - name: Run the tour on each simulator
        run: |
          set -uo pipefail
          IFS='|' read -ra devices <<< "$TOUR_DEVICES"
          mkdir -p "$RUNNER_TEMP/shots"
          failed=0
          for entry in "${devices[@]}"; do
            device="${entry%%=*}"
            label="${entry#*=}"
            slug="$(echo "$label" | tr -cs 'A-Za-z0-9' '-' | sed 's/-*$//')"
            bundle="$RUNNER_TEMP/tour-$slug.xcresult"
            xcrun simctl boot "$device" 2>/dev/null || true
            # The tour records a voice message: answer the microphone prompt up front.
            xcrun simctl privacy "$device" grant microphone com.batuhxn.watchlink 2>/dev/null || true
            xcrun simctl status_bar "$device" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 2>/dev/null || true
            xcodebuild test-without-building -project Vault.xcodeproj -scheme Vault-App -configuration Debug \
              -destination "id=$device" \
              -derivedDataPath "$RUNNER_TEMP/dd" \
              -resultBundlePath "$bundle" \
              -retry-tests-on-failure -test-iterations 2 \
              -only-testing:WatchlinkUITests > "$RUNNER_TEMP/test-$slug.log" 2>&1 || failed=1
            tail -n 25 "$RUNNER_TEMP/test-$slug.log"
            # Say which assertion failed, with its line.
            grep -E "error: -|XCTAssert|failed -" "$RUNNER_TEMP/test-$slug.log" | head -n 20 || true
            xcrun xcresulttool get test-results tests --path "$bundle" 2>/dev/null \
              | python3 -c 'import json,sys
          def walk(n):
              for c in n.get("children", []):
                  if c.get("nodeType") == "Failure Message": print("::error::" + c.get("name", ""))
                  walk(c)
          d = json.load(sys.stdin)
          for t in d.get("testNodes", []): walk(t)' || true
            mkdir -p "$RUNNER_TEMP/shots/$slug"
            xcrun xcresulttool export attachments --path "$bundle" --output-path "$RUNNER_TEMP/shots/$slug" || true
            # Name files after their attachment names (the manifest maps them).
            python3 - "$RUNNER_TEMP/shots/$slug" <<'PY'
          import json, os, sys
          root = sys.argv[1]
          manifest = os.path.join(root, "manifest.json")
          if os.path.exists(manifest):
              for test in json.load(open(manifest)):
                  for a in test.get("attachments", []):
                      src = os.path.join(root, a["exportedFileName"])
                      name = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                      name = name.split("_0_")[0]
                      name = "".join("-" if ch in '/\\"\':<>|*?\r\n' else ch for ch in name)
                      if not name.endswith(".png"):
                          name += ".png"
                      if os.path.exists(src):
                          os.replace(src, os.path.join(root, name))
          print(sorted(os.listdir(root)))
          PY
          done
          ls -R "$RUNNER_TEMP/shots" | head -100
          exit "$failed"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-tour-${{ matrix.size }}
          path: ${{ runner.temp }}/shots
          retention-days: 7
