name: UI tour (simulator screenshots)

# Runs the app in demo mode (-WLDemo: in-memory pair, no network, no Firebase,
# no credentials) on iPhone simulators and photographs every screen. The
# screenshots are uploaded as an artifact for review. Manual only.
on:
  workflow_dispatch:
    inputs:
      devices:
        description: "Simulator names, comma-separated (first available ones are used if empty)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  tour:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false

      - name: Select Xcode 26.3
        run: |
          set -euo pipefail
          xcode_path=/Applications/Xcode_26.3.app
          if [ ! -d "$xcode_path" ]; then
            echo "::error::$xcode_path not found on this runner image. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode_path"

      - name: Install XcodeGen and generate the project
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Pick simulators (a small and a large iPhone)
        env:
          REQUESTED: ${{ inputs.devices }}
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - "$RUNNER_TEMP/devices.json" <<'PY' >> "$GITHUB_ENV"
          import json, os, sys
          data = json.load(open(sys.argv[1]))["devices"]
          ios = [d for runtime, ds in data.items() if "iOS" in runtime for d in ds]
          names = sorted({d["name"] for d in ios if d["name"].startswith("iPhone")})
          requested = [n.strip() for n in os.environ.get("REQUESTED", "").split(",") if n.strip()]
          wanted = requested or ["iPhone 16e", "iPhone SE (3rd generation)", "iPhone 17 Pro Max", "iPhone 16 Pro Max"]
          chosen = [n for n in wanted if n in names]
          small = next((n for n in chosen if "Max" not in n and "Plus" not in n), names[0])
          large = next((n for n in chosen if "Max" in n), names[-1])
          picked = requested and [n for n in requested if n in names] or [small, large]
          print("TOUR_DEVICES=" + "|".join(dict.fromkeys(picked)))
          PY
          grep TOUR_DEVICES "$GITHUB_ENV"

      - name: Build for testing
        run: |
          set -euo pipefail
          first="${TOUR_DEVICES%%|*}"
          xcodebuild build-for-testing -project Vault.xcodeproj -scheme Vault-App -configuration Debug \
            -destination "platform=iOS Simulator,name=$first" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= | tail -n 30

      - name: Run the tour on each simulator
        run: |
          set -uo pipefail
          IFS='|' read -ra devices <<< "$TOUR_DEVICES"
          mkdir -p "$RUNNER_TEMP/shots"
          for device in "${devices[@]}"; do
            slug="$(echo "$device" | tr -cs 'A-Za-z0-9' '-' | sed 's/-*$//')"
            bundle="$RUNNER_TEMP/tour-$slug.xcresult"
            xcrun simctl boot "$device" 2>/dev/null || true
            xcrun simctl status_bar "$device" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 2>/dev/null || true
            xcodebuild test-without-building -project Vault.xcodeproj -scheme Vault-App -configuration Debug \
              -destination "platform=iOS Simulator,name=$device" \
              -derivedDataPath "$RUNNER_TEMP/dd" \
              -resultBundlePath "$bundle" \
              -only-testing:WatchlinkUITests | tail -n 25
            mkdir -p "$RUNNER_TEMP/shots/$slug"
            xcrun xcresulttool export attachments --path "$bundle" --output-path "$RUNNER_TEMP/shots/$slug" || true
            # Name files after their attachment names (the manifest maps them).
            python3 - "$RUNNER_TEMP/shots/$slug" <<'PY'
          import json, os, sys
          root = sys.argv[1]
          manifest = os.path.join(root, "manifest.json")
          if os.path.exists(manifest):
              for test in json.load(open(manifest)):
                  for a in test.get("attachments", []):
                      src = os.path.join(root, a["exportedFileName"])
                      name = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                      name = name.split("_0_")[0].replace("/", "-")
                      if not name.endswith(".png"):
                          name += ".png"
                      if os.path.exists(src):
                          os.replace(src, os.path.join(root, name))
          print(sorted(os.listdir(root)))
          PY
          done
          ls -R "$RUNNER_TEMP/shots" | head -100

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-tour-screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 7
