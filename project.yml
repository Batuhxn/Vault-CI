# Watchlink MVP iOS app (branch mvp/free-firebase). Generate Vault.xcodeproj
# with XcodeGen on macOS: `xcodegen generate --spec project.yml`.
#
# The MLS/E2EE build (WatchlinkMLS package, Rust bridge, qualified test
# suites) is parked on branch park/mls-e2ee. Its app-side files are kept in
# Sources/Vault/Legacy for reference and are not compiled here.
#
# Sources/Vault/GoogleService-Info.plist is gitignored; place it locally (or
# write it from a CI secret) before building.
name: Vault

configs:
  Debug: debug
  Release: release

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # MVP backend (Spark plan). Only Sources/Vault/Backend imports it.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  Vault-App:
    type: application
    platform: iOS
    attributes:
      ProvisioningStyle: Automatic
    sources:
      - path: Sources/Vault
        excludes:
          - Legacy/**
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.batuhxn.watchlink
        CODE_SIGN_ENTITLEMENTS: Vault.entitlements
        PRODUCT_NAME: Vault-App
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Watchlink
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  Vault-App:
    build:
      targets:
        Vault-App: all
    run:
      config: Debug
    archive:
      config: Release
