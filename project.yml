# Production iOS app. Generate Vault.xcodeproj with XcodeGen on macOS.
# The bundle ID is a default; override PRODUCT_BUNDLE_IDENTIFIER at build time
# if the Apple Developer team registers a different identifier.
name: Vault

configs:
  Debug: debug
  Release: release

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  Vault-App:
    type: application
    platform: iOS
    attributes:
      ProvisioningStyle: Automatic
    sources:
      - path: Sources/Vault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.batuhxn.watchlink
        PRODUCT_NAME: Vault-App
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Watchlink
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Watchlink connects directly to your paired computer on the local network to relay messages."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  # Unit tests for the production app only (never spike code). NOT hosted:
  # the bundle compiles the production sources itself, minus the `@main`
  # entry point, so running tests never launches Vault-App, never builds
  # ChatView's default RelayClient, and never opens a socket.
  Vault-AppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Sources/Vault
        excludes:
          - VaultApp.swift
      - path: Tests/Vault-AppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.batuhxn.watchlink.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: ""
        BUNDLE_LOADER: ""

schemes:
  Vault-App:
    build:
      targets:
        Vault-App: all
        # Built for testing only: never part of build/run/archive, so the
        # test bundle cannot end up inside a shipped IPA.
        Vault-AppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Vault-AppTests
    archive:
      config: Release
