# Watchlink MVP iOS app (branch mvp/free-firebase). Generate Vault.xcodeproj
# with XcodeGen on macOS: `xcodegen generate --spec project.yml`.
#
# The MLS/E2EE build (WatchlinkMLS package, Rust bridge, qualified test
# suites) is parked on branch park/mls-e2ee. Its app-side files are kept in
# Sources/Vault/Legacy for reference and are not compiled here.
#
# Sources/Vault/GoogleService-Info.plist is gitignored; place it locally (or
# write it from a CI secret) before building.
name: Vault

configs:
  Debug: debug
  Release: release

options:
  deploymentTarget:
    iOS: "17.0"
  # Turkish UI: system controls (Sign in with Apple, photo picker, dates) follow it.
  developmentLanguage: tr
  createIntermediateGroups: true

packages:
  # MVP backend (Spark plan). Only Sources/Vault/Backend imports it.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  Vault-App:
    type: application
    platform: iOS
    attributes:
      ProvisioningStyle: Automatic
    sources:
      - path: Sources/Vault
        excludes:
          - Legacy/**
      - path: Resources/Assets.xcassets
      # Notification sounds are looked up in the app bundle (heartbeat.wav).
      - path: Resources/Sounds
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      # Opens pushes on the phone (end-to-end encrypted previews).
      - target: WatchlinkNotify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.batuhxn.watchlink
        CODE_SIGN_ENTITLEMENTS: Vault.entitlements
        PRODUCT_NAME: Vault-App
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Watchlink
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone app, portrait only; full screen so iPad compatibility mode needs no multitasking orientations.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: "YES"
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Seçtiğin takvimlerin (örneğin Blackboard) önümüzdeki iki haftasını şifreleyip sadece partnerinle paylaşmak için."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Sesli mesaj kaydetmek için mikrofonu kullanır. Kayıt telefonunda şifrelenir, sadece partnerin dinleyebilir."
        # Export compliance (answered for build 7): standard algorithms only - TLS
        # (Firebase/gRPC) and, from build 12, Apple CryptoKit (X25519, HKDF-SHA256,
        # ChaCha20-Poly1305) for end-to-end encryption; not distributed in France.
        # Re-check the App Store Connect answer before a public App Store release.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  # Notification Service Extension: turns the generic push into the real
  # preview using the pair key the app shares through the app group Keychain.
  WatchlinkNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Notify
        excludes:
          - "*.entitlements"
          - Info.plist
      - path: Sources/Vault/Crypto/PairCrypto.swift
      - path: Sources/Vault/Crypto/SharedPairKey.swift
    info:
      path: Extensions/Notify/Info.plist
      properties:
        CFBundleDisplayName: Watchlink
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.batuhxn.watchlink.notify
        CODE_SIGN_ENTITLEMENTS: Extensions/Notify/Notify.entitlements
        PRODUCT_NAME: WatchlinkNotify
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  # Simulator UI tour (demo mode): photographs every screen for review.
  WatchlinkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/WatchlinkUITests
    dependencies:
      - target: Vault-App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.batuhxn.watchlink.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Vault-App

schemes:
  Vault-App:
    build:
      targets:
        Vault-App: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WatchlinkUITests
    archive:
      config: Release
