# Qualification-only XCTest host. Gives the hosted tests an app identity so the
# simulator grants its default Keychain access; no team, profile or custom
# entitlement. It hosts the qualification test sources.
name: MLSQualificationHost
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  MLSAppleQualification:
    path: ../swift
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  MLSQualificationHost:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.watchlink.m14.qualification.host
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  MLSQualificationHostedTests:
    type: bundle.unit-test
    platform: iOS
    sources: [../swift/Tests/MLSQualificationTests]
    dependencies:
      - target: MLSQualificationHost
      - package: MLSAppleQualification
        product: MLSBridge
      - package: MLSAppleQualification
        product: ProtectedStateStore
      - package: MLSAppleQualification
        product: MLSQualification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.watchlink.m14.qualification.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MLSQualificationHost.app/MLSQualificationHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  MLSQualificationHost:
    build:
      targets:
        MLSQualificationHost: all
        MLSQualificationHostedTests: [test]
    test:
      targets: [MLSQualificationHostedTests]
